[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "air-research-team"
version = "0.1.0"
description = "统一的多智能体学术科研系统 (一个主控 + 七类角色) - LangGraph + RAG (ChromaDB)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "langchain-chroma>=0.2.0",
    "pymupdf>=1.23.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "bibtexparser>=1.4.0",
    "tiktoken>=0.7.0",
    "matplotlib>=3.8.0",
    "sympy>=1.12",
    "z3-solver>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
